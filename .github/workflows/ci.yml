name: Validate Tetris Battle Classic
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client-nuxt/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm --prefix client-nuxt ci
      - run: npm --prefix client-nuxt run typecheck
      - run: npm --prefix client-nuxt test
      - run: TETRIS_DESKTOP=1 npm --prefix client-nuxt run generate
      - run: mkdir -p public && cp -R client-nuxt/.output/public/. public/
      - run: go test -race ./...
