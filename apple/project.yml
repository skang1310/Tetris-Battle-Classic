name: TetrisBattle
options:
  bundleIdPrefix: com.skang1310
  deploymentTarget:
    iOS: '17.0'
    tvOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: AXCMBMA992
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 4
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Tetris Battle
    INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    CODE_SIGN_STYLE: Automatic
targets:
  TetrisBattle-iOS:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.skang1310.tetrisbattle.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TetrisBattle-tvOS:
    type: application
    platform: tvOS
    sources: [Sources, Resources]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: TVBrand
        PRODUCT_BUNDLE_IDENTIFIER: com.skang1310.tetrisbattle.tv
        TARGETED_DEVICE_FAMILY: '3'
